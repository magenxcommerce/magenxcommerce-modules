name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # Validation only: resolving the modules needs magento/framework from
      # repo.magento.com, which requires access keys this repo does not hold.
      # --no-check-all: every module is required as "*" on purpose, which
      # --strict alone rejects as an unbound constraint.
      - run: composer validate --strict --no-check-all --no-check-lock
