name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      # Validation only: resolving the modules needs magento/framework from
      # repo.magento.com, which requires access keys this repo does not hold.
      - run: composer validate --strict --no-check-lock
